apiVersion: apps/v1
kind: Deployment
metadata: 
  name: backend
  labels:
    app.kubernetes.io/component: backend
    app.kubernetes.io/name: laptop-blog

spec:
  replicas: 2
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/component: backend
      app.kubernetes.io/name: laptop-blog
  template:
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsGroup: 10001
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: REPLACE_ME_BACKEND_IMAGE
          ports:
            - name: http 
              containerPort: 4001
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          imagePullPolicy: IfNotPresent
          startupProbe:
            httpGet:
              path: /health/startup
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 3
          
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3

          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 200m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          
          volumeMounts:
            - name: tmp
              mountPath: /tmp

      volumes:
        - name: tmp
          emptyDir: {}
            