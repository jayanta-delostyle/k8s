apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: laptop-blog
resources:
- namespace.yml
- frontend/configmap.yml
- frontend/deployment.yml
- frontend/hpa.yml
- frontend/pdb.yml
- frontend/service.yml
- backend/configmap.yml
- backend/deployment.yml
- backend/service.yml
- backend/hpa.yml
- backend/pdb.yml
- db/secret.yml
- db/service.yml
- db/statefulset.yml
- security/serviceaccounts.yaml
- security/resourcequota
- security/limitrange.yml
commonLabels:
  app.kubernetes.io/part-of: laptop-blog
  app.kubernetes.io/managed-by: kustomize
