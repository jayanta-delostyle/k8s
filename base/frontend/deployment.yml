apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: laptop-blog
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 600

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    
  selector:
    matchLabels:
      app.kubernetes.io/name: laptop-blog
      app.kubernetes.io/component: frontend    

  template:
    metadata:
      labels:
        app.kubernetes.io/name: laptop-blog
        app.kubernetes.io/component: frontend
    
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: REPLACE_ME_FRONTEND_IMAGE
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

          envFrom:
            - configMapRef:
                name: frontend-config
          env:
            - name: API_INTERNAL_URL
              value: https://localhost:400

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            failureThreshold: 3
            timeoutSeconds: 3

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "512m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /temp
            - name: next-cache
              mountPath:  /app/.next/cache

      volumes:
        - name: temp
          emptyDir: {}
        - name: next-cache
          emptyDir: {}