apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secret-manager
    kind: ClusterSecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  data:
  - secretKey: MONGODB_URI
    remoteRef:
      key: laptop-blog/dev
      property: MONGODB_URI
  - secretKey: JWT_SECRET
    remoteRef:
      key: laptop-blog/dev
      property: JWT_SECRET
