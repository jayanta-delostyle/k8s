apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: laptop-blog-dev
resources:
- ../../base
- externalsecret.yml
patches:
- path: path-config.yml
- path: patch-ingress.yaml
- path: patch-serviceaccount.yaml
images:
- name: REPLACE_ME_FRONTEND_IMAGE
